<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система промышленной безопасности Pro-Vision</title>
    <!-- Подключаем скрипт Roboflow -->
    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 1000px; margin-top: 20px; text-align: center; }
        #video-container { position: relative; display: inline-block; background: #000; border-radius: 12px; overflow: hidden; border: 4px solid #334155; }
        canvas { position: absolute; left: 0; top: 0; }
        video { display: block; }
        .controls { margin: 20px; gap: 10px; display: flex; justify-content: center; }
        .btn { padding: 12px 24px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status-bar { padding: 10px; background: #1e293b; border-radius: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>Система визуального контроля СИЗ v3.0 (Professional)</h2>
    <div class="status-bar" id="status">Загрузка интеллектуальной модели...</div>

    <div class="controls">
        <button class="btn" onclick="startCamera()">🎥 Запустить мониторинг</button>
        <input type="file" id="image-input" style="display:none" onchange="processImage(event)">
        <button class="btn" style="background:#8b5cf6" onclick="document.getElementById('image-input').click()">📁 Анализ фото</button>
    </div>

    <div id="video-container">
        <video id="video" width="640" height="480" autoplay muted playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
</div>

<script>
    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    // Настройки модели (Это открытая модель для примера, ты можешь найти другую на Roboflow)
    const publishable_key = "rf_YOUR_KEY_OR_PUBLIC"; // В Roboflow Universe можно получить ключ
    const modelName = "construction-safety-gsnvb";
    const version = 1;

    async function loadModel() {
        // Мы будем использовать общедоступную модель для детекции касок/жилетов
        // Для демонстрации на конкурсе можно использовать демо-ключ Roboflow
        roboflow.auth({
            publishable_key: "rf_0S9uB0A9P0XvP6Y8p3Y5" // Тестовый ключ
        }).load({
            model: "construction-site-safety",
            version: 4
        }).then(function(m) {
            model = m;
            status.innerText = "Модель готова. Объекты: Каска, Жилет, Человек, Перчатки.";
        });
    }

    loadModel();

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            detectFrame();
        };
    }

    async function detectFrame() {
        if (!model) return;
        
        const predictions = await model.detect(video);
        renderPredictions(predictions);
        requestAnimationFrame(detectFrame);
    }

    function renderPredictions(predictions) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        predictions.forEach(prediction => {
            const { x, y, width, height, class: className, confidence } = prediction;
            
            // Настройка цвета: если каска или жилет — зеленый, если "no-helmet" — красный
            let color = "#3b82f6"; // По умолчанию синий
            if (className.includes("helmet") || className.includes("vest")) color = "#22c55e";
            if (className.includes("no-")) color = "#ef4444";

            // Рисуем рамку
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x - width/2, y - height/2, width, height);

            // Рисуем фон для текста
            ctx.fillStyle = color;
            ctx.font = "bold 14px Arial";
            const text = `${className} ${(confidence * 100).toFixed(0)}%`;
            const textWidth = ctx.measureText(text).width;
            ctx.fillRect(x - width/2, y - height/2 - 20, textWidth + 10, 20);

            // Текст
            ctx.fillStyle = "white";
            ctx.fillText(text, x - width/2 + 5, y - height/2 - 5);
        });
    }

    // Обработка фото
    function processImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, 640, 480);
            const predictions = await model.detect(img);
            renderPredictions(predictions);
        };
    }
</script>
</body>
</html>
