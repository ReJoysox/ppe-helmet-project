<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard ИИ | Система мониторинга СИЗ</title>
    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --text: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .dashboard { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); width: 95%; max-width: 1000px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        h1 { color: var(--primary); margin: 0 0 20px 0; font-size: 1.5rem; }
        #display-wrapper { position: relative; width: 640px; height: 480px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-alt { background: #8b5cf6; }
        .side-panel { background: #0f172a80; border-radius: 12px; padding: 15px; font-size: 0.8rem; display: flex; flex-direction: column; }
        #log { flex-grow: 1; overflow-y: auto; margin-top: 10px; color: #94a3b8; }
        .loader { width: 100%; height: 6px; background: #334155; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="main">
        <h1>🛡️ SafeGuard ИИ v5.0</h1>
        
        <div id="loading-area">
            <div id="status-text">Загрузка модели YOLOv8...</div>
            <div class="loader"><div id="progress"></div></div>
        </div>

        <div id="display-wrapper">
            <video id="video" autoplay muted playsinline style="display:none;"></video>
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn" onclick="startCamera()">🎥 КАМЕРА</button>
            <label class="btn btn-alt">📁 ФОТО <input type="file" onchange="processImage(event)"></label>
        </div>
    </div>

    <div class="side-panel">
        <strong>Журнал системы:</strong>
        <div id="log"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
