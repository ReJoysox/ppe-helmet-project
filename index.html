<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интеллектуальная система мониторинга СИЗ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #canvas-container { position: relative; margin-top: 20px; border: 2px solid #334155; border-radius: 10px; overflow: hidden; background: #000; display: inline-block; }
        canvas { display: block; max-width: 100%; height: auto; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-upload { background: #8b5cf6; }
        .btn-upload:hover { background: #7c3aed; }
        #loading-status { color: #38bdf8; margin: 10px; font-weight: bold; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Система мониторинга СИЗ v2.0</h1>
    <div id="loading-status">Загрузка систем ИИ...</div>
    
    <div class="controls">
        <button class="btn" onclick="startWebcam()">🎥 Режим веб-камеры</button>
        <label class="btn btn-upload">
            📁 Загрузить фото
            <input type="file" id="image-upload" accept="image/*">
        </label>
    </div>

    <div id="canvas-container">
        <canvas id="output-canvas"></canvas>
    </div>
    <div style="margin-top: 15px; color: #94a3b8; font-size: 0.9em;">
        * Система автоматически находит людей и проверяет наличие каски и жилета
    </div>
</div>

<script>
    const MODEL_PATH = "model/"; 
    const CLASS_WITH_PPE = "WITH_PPE"; 

    let model, detector, webcam, ctx, canvas;
    let isLive = false;

    // Автоматическая загрузка нейросетей при старте
    async function loadModels() {
        const status = document.getElementById('loading-status');
        try {
            detector = await cocoSsd.load();
            model = await tmImage.load(MODEL_PATH + "model.json", MODEL_PATH + "metadata.json");
            status.innerText = "Системы ИИ готовы к работе";
        } catch (e) {
            status.innerText = "Ошибка загрузки моделей! Проверьте папку model/";
        }
    }
    loadModels();

    // Настройка холста
    canvas = document.getElementById("output-canvas");
    ctx = canvas.getContext("2d");

    // --- РЕЖИМ ВЕБ-КАМЕРЫ ---
    async function startWebcam() {
        if (!detector || !model) return alert("Модели еще грузятся!");
        isLive = true;
        webcam = new tmImage.Webcam(640, 480, true);
        await webcam.setup();
        await webcam.play();
        canvas.width = 640;
        canvas.height = 480;
        window.requestAnimationFrame(loop);
    }

    async function loop() {
        if (!isLive) return;
        webcam.update();
        await processSource(webcam.canvas);
        window.requestAnimationFrame(loop);
    }

    // --- РЕЖИМ ЗАГРУЗКИ ФОТО ---
    const fileInput = document.getElementById('image-upload');
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        isLive = false; // Останавливаем веб-камеру, если она работала
        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = async () => {
            // Подстраиваем размер холста под фото
            const scale = Math.min(800 / img.width, 600 / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            // Рисуем и обрабатываем
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            await processSource(canvas);
        };
    });

    // --- ЕДИНАЯ ЛОГИКА ОБРАБОТКИ (Детекция + Классификация) ---
    async function processSource(sourceElement) {
        // Очистка кадра и отрисовка исходника
        if (!isLive) ctx.drawImage(sourceElement, 0, 0, canvas.width, canvas.height);
        else ctx.drawImage(sourceElement, 0, 0);

        // 1. Детекция людей
        const objects = await detector.detect(sourceElement);
        const people = objects.filter(obj => obj.class === "person");

        // 2. Классификация СИЗ для каждого
        for (let person of people) {
            let [x, y, width, height] = person.bbox;

            // Масштабируем координаты, если это загруженное фото (оно может быть больше холста)
            if (!isLive) {
                // В данном случае sourceElement и есть canvas, так что координаты уже верны
            }

            // Создаем временный кроп (вырезку) человека
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 224; // Стандартный размер входа для многих нейросетей
            tempCanvas.height = 224;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(sourceElement, x, y, width, height, 0, 0, 224, 224);

            const prediction = await model.predict(tempCanvas);
            const result = prediction.reduce((prev, curr) => (prev.probability > curr.probability) ? prev : curr);

            // 3. Отрисовка результатов
            const isSafe = result.className === CLASS_WITH_PPE;
            const color = isSafe ? "#22c55e" : "#ef4444";
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            ctx.fillStyle = color;
            ctx.font = "bold 14px Arial";
            const text = `${isSafe ? "БЕЗОПАСНО" : "БЕЗ СИЗ"} ${(result.probability * 100).toFixed(0)}%`;
            ctx.fillText(text, x, y > 15 ? y - 7 : 15);
        }
    }
</script>
</body>
</html>
