<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard ИИ | Debug Mode</title>
    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
    <style>
        :root { --p: #3b82f6; --bg: #0f172a; --c: #1e293b; --d: #ef4444; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .dashboard { max-width: 1000px; margin: auto; background: var(--c); padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #monitor { position: relative; width: 640px; height: 480px; background: #000; border-radius: 12px; overflow: hidden; border: 3px solid #334155; margin: 0 auto; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .btn { padding: 12px 25px; background: var(--p); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        
        /* ОКНО ОТЛАДКИ */
        #debug-console { 
            background: #000; 
            color: #22c55e; 
            padding: 15px; 
            border-radius: 10px; 
            text-align: left; 
            font-family: monospace; 
            font-size: 12px; 
            margin-top: 20px; 
            max-height: 150px; 
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .err-msg { color: var(--d); font-weight: bold; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 5px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>🛡️ SafeGuard ИИ: Отладка системы</h1>
    
    <!-- Сюда выведем реальную ошибку -->
    <div id="error-display" class="err-msg"></div>

    <div id="monitor">
        <video id="video" autoplay muted playsinline style="display:none;"></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <button class="btn" onclick="startCamera()">🎥 ЗАПУСТИТЬ МОНИТОРИНГ</button>

    <div id="debug-console">
        <div>[SYSTEM] Инициализация...</div>
    </div>
</div>

<script>
    const API_KEY = "rf_LKryTgEjdCbkT8neRDfLFtdPHzj2";
    const logBox = document.getElementById('debug-console');
    const errDisplay = document.getElementById('error-display');

    function print(msg, isError = false) {
        const d = document.createElement('div');
        d.innerHTML = `> ${msg}`;
        if (isError) d.style.color = "#ef4444";
        logBox.appendChild(d);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function initAI() {
        print("Проверка протокола: " + window.location.protocol);
        
        if (window.location.protocol === 'file:') {
            showFatalError("ОШИБКА: Вы запустили файл с диска. Залейте его на GitHub или используйте Live Server!");
            return;
        }

        try {
            print("Авторизация в Roboflow...");
            roboflow.auth({ publishable_key: API_KEY });
            
            print("Загрузка модели construction-site-safety/4...");
            const model = await roboflow.load({
                model: "construction-site-safety",
                version: 4
            });

            print("МОДЕЛЬ ЗАГРУЖЕНА УСПЕШНО!", false);
            window.aiModel = model; // Сохраняем в глобальную переменную
        } catch (e) {
            console.error(e);
            showFatalError("КРИТИЧЕСКАЯ ОШИБКА ИИ: " + e.message);
        }
    }

    function showFatalError(msg) {
        errDisplay.innerText = msg;
        errDisplay.style.display = "block";
        print(msg, true);
    }

    async function startCamera() {
        if (!window.aiModel) {
            alert("Нейросеть еще не загружена. Подождите...");
            return;
        }
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = "block";
            print("Камера запущена.");

            const detect = async () => {
                const predictions = await window.aiModel.detect(video);
                ctx.clearRect(0, 0, 640, 480);
                ctx.drawImage(video, 0, 0, 640, 480);

                predictions.forEach(p => {
                    if (p.confidence > 0.6) {
                        const color = p.class.includes("no-") ? "#ef4444" : "#22c55e";
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 4;
                        ctx.strokeRect(p.x - p.width/2, p.y - p.height/2, p.width, p.height);
                        ctx.fillStyle = color;
                        ctx.fillText(p.class.toUpperCase(), p.x - p.width/2, p.y - p.height/2 - 10);
                    }
                });
                requestAnimationFrame(detect);
            };
            detect();
        } catch (err) {
            showFatalError("ОШИБКА КАМЕРЫ: " + err.message);
        }
    }

    initAI();
</script>
</body>
</html>
