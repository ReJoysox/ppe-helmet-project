<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard Про | YOLOv8 Мониторинг</title>
    <!-- Подключаем библиотеку Roboflow напрямую -->
    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .dashboard { max-width: 1000px; margin: auto; background: var(--card); padding: 30px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); margin-bottom: 20px; }
        #monitor-box { position: relative; width: 640px; height: 480px; background: #000; border-radius: 15px; overflow: hidden; border: 3px solid #334155; margin: 0 auto; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .controls { margin-top: 20px; display: flex; gap: 15px; justify-content: center; }
        .btn { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
        #status-bar { padding: 10px; background: #334155; border-radius: 10px; margin-bottom: 15px; font-weight: bold; color: #38bdf8; }
        .log { background: #0f172a; padding: 15px; border-radius: 12px; font-size: 13px; color: #94a3b8; text-align: left; margin-top: 20px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>🛡️ SafeGuard Про: YOLOv8</h1>
    <div id="status-bar">Загрузка интеллектуального ядра...</div>
    
    <div id="monitor-box">
        <video id="video" autoplay muted playsinline style="display:none;"></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="startCamera()">🎥 ЖИВОЙ ЭФИР</button>
        <label class="btn" style="background:#8b5cf6; text-align:center;">
            📁 АНАЛИЗ ФОТО <input type="file" style="display:none" onchange="processImage(event)">
        </label>
    </div>

    <div class="log" id="log">Ожидание инициализации...</div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status-bar');
    const logBox = document.getElementById('log');

    let model;
    let isLive = false;

    function addLog(msg) {
        const d = document.createElement('div');
        d.innerHTML = `> ${msg}`;
        logBox.prepend(d);
    }

    // 1. ПОДКЛЮЧЕНИЕ К МОДЕЛИ ЧЕРЕЗ КЛЮЧ
    // Мы используем официальный API Roboflow — это самый надежный способ.
    async function loadModel() {
        addLog("Подключение к базе данных Roboflow...");
        
        roboflow.auth({
            publishable_key: "rf_0S9uB0A9P0XvP6Y8p3Y5" // Демо-ключ
        }).load({
            model: "construction-site-safety",
            version: 4
        }).then(m => {
            model = m;
            status.innerText = "YOLOv8: СИСТЕМА АКТИВНА";
            status.style.color = "#22c55e";
            addLog("Модель YOLOv4-8 загружена успешно.");
        }).catch(err => {
            addLog("Ошибка загрузки. Пожалуйста, используйте GitHub Pages!");
        });
    }

    loadModel();

    // 2. КАМЕРА
    async function startCamera() {
        if (!model) return;
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = "block";
        isLive = true;
        addLog("Запущен мониторинг в реальном времени.");
        detectFrame();
    }

    async function detectFrame() {
        if (!isLive) return;
        const predictions = await model.detect(video);
        render(predictions, video);
        requestAnimationFrame(detectFrame);
    }

    // 3. ФОТО
    function processImage(event) {
        const file = event.target.files[0];
        if (!file || !model) return;
        isLive = false;
        video.style.display = "none";
        
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, 640, 480);
            const predictions = await model.detect(img);
            render(predictions, img);
            addLog("Анализ фото завершен.");
        };
    }

    // 4. ОТРИСОВКА (ПОРОГ 65% чтобы отсечь шапки)
    function render(predictions, source) {
        if (isLive) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(source, 0, 0, 640, 480);
        }

        predictions.forEach(p => {
            if (p.confidence > 0.65) {
                // Если класс содержит "no-", значит это нарушение
                const isViolation = p.class.toLowerCase().includes("no-") || p.class === "person";
                let color = isViolation ? "#ef4444" : "#22c55e";
                
                // Рисуем рамку
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.strokeRect(p.x - p.width/2, p.y - p.height/2, p.width, p.height);

                // Рисуем плашку текста
                ctx.fillStyle = color;
                ctx.fillRect(p.x - p.width/2, p.y - p.height/2 - 25, p.width, 25);
                ctx.fillStyle = "white";
                ctx.font = "bold 14px Arial";
                ctx.fillText(`${p.class.toUpperCase()} ${(p.confidence*100).toFixed(0)}%`, p.x - p.width/2 + 5, p.y - p.height/2 - 7);
            }
        });
    }
</script>
</body>
</html>
