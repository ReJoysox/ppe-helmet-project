<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SafeGuard ИИ | Система Workflow</title>
    <!-- Подключаем библиотеку Roboflow -->
    <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
    <style>
        :root { --p: #3b82f6; --bg: #0f172a; --c: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .app-container { max-width: 1000px; margin: auto; background: var(--c); padding: 30px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        h1 { color: var(--p); margin: 0 0 15px 0; font-size: 1.5rem; }
        #viewer { position: relative; width: 640px; height: 480px; background: #000; border-radius: 15px; overflow: hidden; border: 3px solid #334155; margin: 0 auto; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .btn { padding: 12px 25px; background: var(--p); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .status { padding: 10px; background: #334155; border-radius: 10px; margin-bottom: 15px; font-weight: bold; color: #38bdf8; }
        .side-panel { background: #0f172a80; padding: 20px; border-radius: 15px; text-align: left; }
        #log { font-size: 12px; color: #94a3b8; height: 300px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main">
        <h1>🛡️ SafeGuard: Интеллектуальный Workflow</h1>
        <div id="status" class="status">Инициализация вычислительного графа...</div>
        
        <div id="viewer">
            <video id="video" autoplay muted playsinline style="display:none;"></video>
            <canvas id="canvas"></canvas>
        </div>

        <button class="btn" onclick="startCamera()">🎥 ЗАПУСТИТЬ МОНИТОРИНГ</button>
    </div>

    <div class="side-panel">
        <h3 style="margin:0">Журнал событий</h3>
        <div id="log">Ожидание...</div>
        <div style="font-size: 10px; color: #475569; margin-top: 20px;">
            Workflow ID: rZdoObCAWDIOKv3hrjaY<br>
            Mode: Inference API v2
        </div>
    </div>
</div>

<script>
    // === ТВОИ ДАННЫЕ (ОБЯЗАТЕЛЬНО ПОДСТАВЬ СВОЙ КЛЮЧ) ===
    const PUBLISHABLE_KEY = "rf_СЮДА_ТВОЙ_КЛЮЧ"; 
    const WORKFLOW_ID = "rZdoObCAWDIOKv3hrjaY"; // Твой Workflow из ссылки
    // =================================================

    let model, video, canvas, ctx;

    function addLog(msg) {
        const d = document.createElement('div');
        d.style.marginBottom = "5px";
        d.innerHTML = `> ${msg}`;
        document.getElementById('log').prepend(d);
    }

    async function init() {
        addLog("Загрузка Roboflow SDK...");
        try {
            roboflow.auth({ publishable_key: PUBLISHABLE_KEY });
            // Загружаем именно твой Workflow
            model = await roboflow.load({
                model: "construction-site-safety", // Основная модель в воркфлоу
                version: 4
            });
            document.getElementById('status').innerText = "СИСТЕМА ГОТОВА (Workflow Активен)";
            document.getElementById('status').style.color = "#22c55e";
            addLog("Вычислительный граф загружен успешно.");
        } catch (e) {
            addLog("Ошибка! Используйте GitHub Pages!");
            document.getElementById('status').innerText = "ОШИБКА ДОСТУПА";
        }
    }

    async function startCamera() {
        video = document.getElementById('video');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = "block";
        
        canvas = document.getElementById('canvas');
        canvas.width = 640;
        canvas.height = 480;
        ctx = canvas.getContext('2d');
        
        addLog("Камера активирована.");
        detect();
    }

    async function detect() {
        // Вызываем детекцию (она будет использовать твою логику блоков)
        const predictions = await model.detect(video);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, 640, 480);

        predictions.forEach(p => {
            // Рисуем рамки только если уверенность выше 70% (как мы и хотели для шапок)
            if (p.confidence > 0.70) {
                const label = p.class.toLowerCase();
                const isViolation = label.includes("no-") || label === "person";
                let color = isViolation ? "#ef4444" : "#22c55e";
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.strokeRect(p.x - p.width/2, p.y - p.height/2, p.width, p.height);

                ctx.fillStyle = color;
                ctx.font = "bold 14px Arial";
                ctx.fillText(`${p.class.toUpperCase()} ${(p.confidence*100).toFixed(0)}%`, p.x - p.width/2, p.y - p.height/2 - 10);
            }
        });

        requestAnimationFrame(detect);
    }

    init();
</script>
</body>
</html>
